services:
  - type: web
    name: docripple-api
    runtime: python
    rootDir: docsync-agent
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: EMBEDDING_MODE
        value: tfidf
      - key: SQLITE_DB_PATH
        value: /tmp/docsync_context.db
      - key: CHECKPOINT_DB_PATH
        value: /tmp/docsync_checkpoints.db
      - key: PUBLIC_WEBHOOK_URL
        value: https://docripple-api.onrender.com/api/v1/webhooks/github
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: qwen/qwen-2.5-coder-32b-instruct
      - key: FRONTEND_URL
        sync: false
